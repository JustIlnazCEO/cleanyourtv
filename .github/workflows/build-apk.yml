name: Build launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build launcher APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run tests, lint and build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Check APK size
        run: |
          apk="launcher/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          size=$(stat -c %s "$apk")
          echo "Release APK: $((size / 1024)) KB"
          test "$size" -lt 589824 || {
            echo "::error::APK is over 576 KB"
            exit 1
          }

      - name: Upload release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cleanyourtv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
